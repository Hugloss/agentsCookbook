name: Validate cookbook

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-and-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonical source contracts
        run: ./scripts/check-canonical-sources.sh

      - name: Adapter smoke tests
        run: ./scripts/smoke-opencode-scripts.sh

      - name: Script behavior and installation regressions
        run: node --test scripts/test-*.js

      - name: Live artifact integrity smoke tests
        run: bash ./scripts/smoke-run-artifacts.sh

      - name: Pi reviewer child authority
        run: node scripts/check-pi-reviewer-boundary.js

      - name: JavaScript syntax
        run: |
          for script in scripts/*.js scripts/*.mjs adapters/opencode/*.js adapters/pi/*.js; do
            node --check "$script"
          done

      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
