name: Validate cookbook

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-and-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonical source contracts
        run: ./scripts/check-canonical-sources.sh

      - name: Sharp skill corpus contracts
        run: node scripts/run-skill-benchmarks.js --validate-corpus

      - name: Adapter smoke tests
        run: ./scripts/smoke-opencode-scripts.sh

      - name: Live artifact integrity smoke tests
        run: bash ./scripts/smoke-run-artifacts.sh

      - name: Pi reviewer child authority
        run: node scripts/check-pi-reviewer-boundary.js

      - name: JavaScript syntax
        run: |
          node --check scripts/check-pi-session.js
          node --check scripts/check-pi-reviewer-boundary.js
          node --check scripts/run-opencode-benchmarks.js
          node --check scripts/run-skill-benchmarks.js
          node --check scripts/export-review-artifacts.js
          node --check scripts/check-run-artifacts.js
          node --check adapters/opencode/review-artifact.js
          node --check adapters/pi/index.js
          node --check adapters/pi/reviewer-tool-boundary.js
          node --check adapters/pi/review-artifact.js

      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile benchmark framework
        run: python -m compileall -q benchmarks

      - name: Validate benchmark schema JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("benchmarks/schema").glob("*.json"))
          if not paths:
              raise SystemExit("no benchmark schemas found")
          for path in paths:
              value = json.loads(path.read_text(encoding="utf-8"))
              if value.get("$schema") != "https://json-schema.org/draft/2020-12/schema":
                  raise SystemExit(f"{path}: unexpected or missing JSON Schema draft")
              if not value.get("$id"):
                  raise SystemExit(f"{path}: missing $id")
          print(f"validated {len(paths)} benchmark schemas")
          PY

      - name: Benchmark foundation regressions
        run: python -m unittest discover -s benchmarks/tests -v

  agent-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Agent Economics
        run: python -m compileall -q scripts/agent_economics

      - name: Agent Economics full qualification
        run: |
          set -euo pipefail
          modules=(
            refactor_focus_qualification
            refactor_focus_p2_qualification
            refactor_focus_p3_qualification
            probe_contract_qualification
            refactor_focus_p5_qualification
            context_focus_qualification
            test_focus_qualification
            change_impact_qualification
            coupling_focus_qualification
            hotspot_focus_qualification
            capability_bridge_qualification
            agent_outcome_benchmark_qualification
            dogfood_campaign_qualification
            quality_debt_qualification
            behavior_preservation_qualification
            refactor_locality_qualification
            bounded_evidence_batches_qualification
            bootstrap_qualification
            zero_to_first_result_qualification
            evidence_next_qualification
            explain_qualification
            cli_consistency_qualification
            dogfood_corpus_qualification
            pre_pr_qualification
            agent_economics_stress_qualification
          )
          for module in "${modules[@]}"; do
            python -m "scripts.agent_economics.${module}"
          done

      - name: Standalone package import smoke
        run: |
          PYTHONPATH="$PWD/scripts" python -c "import agent_economics; from agent_economics.test_focus import test_focus_audit; from agent_economics.quality_debt import quality_debt_audit"

      - name: CLI routing smoke
        run: |
          python -m scripts.agent_economics --help >/dev/null
          python -m scripts.agent_economics doctor --repository-root . --json >/dev/null
          python -m scripts.agent_economics help quality-debt >/dev/null
          python -m scripts.agent_economics capabilities --repository-root . --json >/dev/null
          python -m scripts.agent_economics evidence-batches --help >/dev/null
          python -m scripts.agent_economics refactor-locality --help >/dev/null
          python -m scripts.agent_economics benchmark-outcomes --template-task ci-smoke >/dev/null
          python -m scripts.agent_economics dogfood-campaign --help >/dev/null

      - name: Build qualified standalone Agent Economics artifact
        shell: bash
        run: |
          set -euo pipefail
          revision="${GITHUB_SHA}"
          stage="$RUNNER_TEMP/agent-economics-artifact"
          artifact="agent-economics-${revision}.zip"
          mkdir -p "$stage/agent-economics"
          cp -a scripts/agent_economics "$stage/agent-economics/"
          cp scripts/bootstrap-agent-economics.sh "$stage/agent-economics/"
          cp docs/agent-economics-dogfood.md "$stage/agent-economics/"
          REVISION="$revision" STAGE="$stage/agent-economics" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["STAGE"])
          rows = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              rows.append({
                  "path": path.relative_to(root).as_posix(),
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              })
          receipt = {
              "schema": {"name": "agent-economics-qualified-artifact", "version": 1},
              "implementation_id": f"github:Hugloss/agentsCookbook@{os.environ['REVISION']}",
              "qualification_workflow": ".github/workflows/validate.yml",
              "qualification_job": "agent-economics",
              "files": rows,
          }
          (root / "qualification-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$stage"
            python -m zipfile -c "$GITHUB_WORKSPACE/$artifact" agent-economics
          )
          sha256sum "$artifact" > "$artifact.sha256"
          printf '%s\n' "$artifact" > agent-economics-artifact-name.txt

      - name: Upload qualified standalone Agent Economics artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-economics-${{ github.sha }}
          path: |
            agent-economics-${{ github.sha }}.zip
            agent-economics-${{ github.sha }}.zip.sha256
            agent-economics-artifact-name.txt
          if-no-files-found: error
          retention-days: 30
