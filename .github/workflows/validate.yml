name: Validate cookbook

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-and-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonical source contracts
        run: ./scripts/check-canonical-sources.sh

      - name: Adapter smoke tests
        run: ./scripts/smoke-opencode-scripts.sh

      - name: Live artifact integrity smoke tests
        run: bash ./scripts/smoke-run-artifacts.sh

      - name: Pi reviewer child authority
        run: node scripts/check-pi-reviewer-boundary.js

      - name: JavaScript syntax
        run: |
          node --check scripts/check-pi-session.js
          node --check scripts/check-pi-reviewer-boundary.js
          node --check scripts/run-opencode-benchmarks.js
          node --check scripts/export-review-artifacts.js
          node --check scripts/check-run-artifacts.js
          node --check adapters/opencode/review-artifact.js
          node --check adapters/pi/reviewer-tool-boundary.js
          node --check adapters/pi/review-artifact.js

      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
