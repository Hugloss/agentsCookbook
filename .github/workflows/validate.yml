name: Validate cookbook

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-and-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonical source contracts
        run: ./scripts/check-canonical-sources.sh

      - name: Sharp skill corpus contracts
        run: node scripts/run-skill-benchmarks.js --validate-corpus

      - name: Adapter smoke tests
        run: ./scripts/smoke-opencode-scripts.sh

      - name: Live artifact integrity smoke tests
        run: bash ./scripts/smoke-run-artifacts.sh

      - name: Pi reviewer child authority
        run: node scripts/check-pi-reviewer-boundary.js

      - name: JavaScript syntax
        run: |
          node --check scripts/check-pi-session.js
          node --check scripts/check-pi-reviewer-boundary.js
          node --check scripts/run-opencode-benchmarks.js
          node --check scripts/run-skill-benchmarks.js
          node --check scripts/export-review-artifacts.js
          node --check scripts/check-run-artifacts.js
          node --check adapters/opencode/review-artifact.js
          node --check adapters/pi/index.js
          node --check adapters/pi/reviewer-tool-boundary.js
          node --check adapters/pi/review-artifact.js

      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

  agent-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Agent Economics
        run: python -m compileall -q scripts/agent_economics

      - name: P1-P11 qualification
        run: |
          set -euo pipefail
          modules=(
            refactor_focus_qualification
            refactor_focus_p2_qualification
            refactor_focus_p3_qualification
            probe_contract_qualification
            refactor_focus_p5_qualification
            context_focus_qualification
            test_focus_qualification
            change_impact_qualification
            coupling_focus_qualification
            hotspot_focus_qualification
            capability_bridge_qualification
            agent_outcome_benchmark_qualification
            quality_debt_qualification
            pre_pr_qualification
          )
          for module in "${modules[@]}"; do
            python -m "scripts.agent_economics.${module}"
          done

      - name: CLI routing smoke
        run: |
          python -m scripts.agent_economics --help >/dev/null
          python -m scripts.agent_economics capabilities --repository-root . --json >/dev/null
          python -m scripts.agent_economics benchmark-outcomes --template-task ci-smoke >/dev/null
